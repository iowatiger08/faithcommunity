AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Hope & Truth Ministry — Lambda functions, API Gateway, SES, and Route 53 DNS

Parameters:
  HopeAndTruthHostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Default: Z1W12OVIJHI59G
    Description: Route 53 hosted zone for hopeandtruthministry.com
  SenderDomain:
    Type: String
    Default: hopeandtruthministry.com
    Description: Domain used for SES sending identity and DKIM records
  OwnerUserPoolId:
    Type: String
    Default: us-west-2_OMwj6Yfpn
    Description: Shared owner sign-in pool (tigersndragons-users) used for comment moderation
  OwnerClientId:
    Type: String
    Default: 5p01qepq8kh9qfuji1occiud19
    Description: Public SPA client in the owner pool
  OwnerSub:
    Type: String
    Default: c831f380-7071-7082-6ecc-6110e068d744
    Description: The only account in the owner pool allowed to moderate comments

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs24.x
    Architectures:
      - x86_64

Resources:

  # ── SES email identity + DKIM ─────────────────────────────────────────────
  # Manages the sending identity for noreply@hopeandtruthministry.com.
  # CloudFormation provisions DKIM keys and outputs the three CNAME tokens;
  # the records below wire them into Route 53 automatically.
  # To tear down: sam delete (removes identity + DKIM records together).
  SesEmailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref SenderDomain
      DkimAttributes:
        SigningEnabled: true

  SesDkimRecord1:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HopeAndTruthHostedZoneId
      Name: !Sub "${SesEmailIdentity.DkimDNSTokenName1}._domainkey.${SenderDomain}"
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - !Sub "${SesEmailIdentity.DkimDNSTokenValue1}"

  SesDkimRecord2:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HopeAndTruthHostedZoneId
      Name: !Sub "${SesEmailIdentity.DkimDNSTokenName2}._domainkey.${SenderDomain}"
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - !Sub "${SesEmailIdentity.DkimDNSTokenValue2}"

  SesDkimRecord3:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HopeAndTruthHostedZoneId
      Name: !Sub "${SesEmailIdentity.DkimDNSTokenName3}._domainkey.${SenderDomain}"
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - !Sub "${SesEmailIdentity.DkimDNSTokenValue3}"

  # ── Blogger proxy ─────────────────────────────────────────────────────────
  BloggerProxyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-blogger-proxy"
      CodeUri: blogger-proxy/
      Handler: index.handler
      Runtime: nodejs24.x
      MemorySize: 256
      Timeout: 30
      LoggingConfig:
        LogGroup: !Ref BloggerProxyLogGroup
      Environment:
        Variables:
          NODE_OPTIONS: '--enable-source-maps'
      Policies:
        - Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: 'arn:aws:secretsmanager:us-west-2:166782860262:secret:prod/blogger-3y8Pt2'
      Events:
        BloggerApi:
          Type: Api
          Properties:
            Path: /blogger/posts
            Method: get
            RestApiId: !Ref BloggerApiGateway
        BloggerApiOptions:
          Type: Api
          Properties:
            Path: /blogger/posts
            Method: options
            RestApiId: !Ref BloggerApiGateway

  BloggerProxyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-blogger-proxy"
      RetentionInDays: 14

  BloggerApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'hopeandtruthministry.com'"
      DefinitionBody:
        openapi: 3.0.0
        info:
          title: Blogger Proxy API
          version: 1.0.0
        paths:
          /blogger/posts:
            get:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BloggerProxyFunction.Arn}/invocations
              responses:
                '200':
                  description: Success
            options:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BloggerProxyFunction.Arn}/invocations
              responses:
                '200':
                  description: Success

  # ── Contact form ──────────────────────────────────────────────────────────
  ContactFormFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-contact-form"
      CodeUri: contact-form/
      Handler: index.handler
      Runtime: nodejs24.x
      MemorySize: 128
      Timeout: 15
      LoggingConfig:
        LogGroup: !Ref ContactFormLogGroup
      Environment:
        Variables:
          RECIPIENT_EMAIL: hopeandtruthministry@gmail.com
          SENDER_EMAIL: !Sub "noreply@${SenderDomain}"
          TOXICITY_THRESHOLD: "0.75"
          RATE_LIMIT_PER_HOUR: "2"
      Policies:
        - Statement:
          - Effect: Allow
            Action:
              - ses:SendEmail
            Resource: "*"
          - Effect: Allow
            Action:
              - comprehend:DetectToxicContent
            Resource: "*"
      Events:
        ContactPost:
          Type: HttpApi
          Properties:
            Path: /contact
            Method: post
            ApiId: !Ref ContactHttpApi
        ContactOptions:
          Type: HttpApi
          Properties:
            Path: /contact
            Method: options
            ApiId: !Ref ContactHttpApi

  ContactFormLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-contact-form"
      RetentionInDays: 14

  ContactHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # Caps the SES bill if anyone hammers /contact. 10 rps is orders of
      # magnitude above this site's real traffic, so it engages only under
      # attack.
      DefaultRouteSettings:
        ThrottlingRateLimit: 10
        ThrottlingBurstLimit: 20
      CorsConfiguration:
        AllowOrigins:
          - "https://hopeandtruthministry.com"
          - "https://www.hopeandtruthministry.com"
          - "http://localhost:5173"
          - "http://localhost:4173"
        AllowHeaders:
          - Content-Type
        AllowMethods:
          - POST
          - OPTIONS
        MaxAge: 300

  # ── Comments and reactions ────────────────────────────────────────────────
  # Commenter accounts live in their own pool, separate from every other site's
  # users, so a token from another pool can never pass this API's authorizer.
  # Tables have no TTL: nothing expires; deletion is always an explicit action
  # (a person deleting their comment or account, or a moderator removing one).
  CommentersUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-commenters"
      UserPoolTier: ESSENTIALS
      DeletionProtection: ACTIVE
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false
          RequireUppercase: false
        # Email one-time codes are the main way in. The service requires
        # PASSWORD to stay in the list.
        SignInPolicy:
          AllowedFirstAuthFactors:
            - PASSWORD
            - EMAIL_OTP
      EmailConfiguration:
        EmailSendingAccount: DEVELOPER
        SourceArn: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${SenderDomain}"
        From: !Sub "Hope & Truth Ministry <noreply@${SenderDomain}>"
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

  CommentersUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref CommentersUserPool
      Domain: hopeandtruthministry
      ManagedLoginVersion: 2

  CommentersUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref CommentersUserPool
      ClientName: site
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - https://hopeandtruthministry.com/auth/callback/
        - https://www.hopeandtruthministry.com/auth/callback/
        - http://localhost:5173/auth/callback/
      LogoutURLs:
        - https://hopeandtruthministry.com/
        - https://www.hopeandtruthministry.com/
        - http://localhost:5173/
      ExplicitAuthFlows:
        - ALLOW_USER_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  CommentersManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    Properties:
      UserPoolId: !Ref CommentersUserPool
      ClientId: !Ref CommentersUserPoolClient
      UseCognitoProvidedValues: true

  CommentProfilesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-comment-profiles"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: sub
          AttributeType: S
      KeySchema:
        - AttributeName: sub
          KeyType: HASH

  CommentsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-comments"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: commentId
          AttributeType: S
        - AttributeName: postSlug
          AttributeType: S
        - AttributeName: authorSub
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: commentId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byPost
          KeySchema:
            - AttributeName: postSlug
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: byAuthor
          KeySchema:
            - AttributeName: authorSub
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: byStatus
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  CommentReactionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-comment-reactions"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: postSlug
          AttributeType: S
        - AttributeName: reactionKey
          AttributeType: S
        - AttributeName: sub
          AttributeType: S
      KeySchema:
        - AttributeName: postSlug
          KeyType: HASH
        - AttributeName: reactionKey
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: bySub
          KeySchema:
            - AttributeName: sub
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  CommentReportsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-comment-reports"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: commentId
          AttributeType: S
        - AttributeName: reporterSub
          AttributeType: S
      KeySchema:
        - AttributeName: commentId
          KeyType: HASH
        - AttributeName: reporterSub
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: byReporter
          KeySchema:
            - AttributeName: reporterSub
              KeyType: HASH
          Projection:
            ProjectionType: KEYS_ONLY

  CommentAuditTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-comment-audit"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: day
          AttributeType: S
        - AttributeName: entryKey
          AttributeType: S
      KeySchema:
        - AttributeName: day
          KeyType: HASH
        - AttributeName: entryKey
          KeyType: RANGE

  CommentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-comments"
      CodeUri: comments/
      Handler: index.handler
      MemorySize: 256
      Timeout: 15
      LoggingConfig:
        LogGroup: !Ref CommentsLogGroup
      Environment:
        Variables:
          PROFILES_TABLE: !Ref CommentProfilesTable
          COMMENTS_TABLE: !Ref CommentsTable
          REACTIONS_TABLE: !Ref CommentReactionsTable
          REPORTS_TABLE: !Ref CommentReportsTable
          AUDIT_TABLE: !Ref CommentAuditTable
          USER_POOL_ID: !Ref CommentersUserPool
          SITE_ORIGIN: !Sub "https://${SenderDomain}"
          OWNER_SUB: !Ref OwnerSub
          RECIPIENT_EMAIL: hopeandtruthministry@gmail.com
          SENDER_EMAIL: !Sub "noreply@${SenderDomain}"
          TOXICITY_THRESHOLD: "0.7"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CommentProfilesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CommentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CommentReactionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CommentReportsTable
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt CommentAuditTable.Arn
            - Effect: Allow
              Action:
                - comprehend:DetectToxicContent
                - ses:SendEmail
              Resource: "*"
            - Effect: Allow
              Action:
                - cognito-idp:AdminDeleteUser
              Resource: !GetAtt CommentersUserPool.Arn
      Events:
        ReadPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref CommentsHttpApi
            Path: /posts/{slug}
            Method: get
            Auth:
              Authorizer: NONE
        ReadPostMine:
          Type: HttpApi
          Properties:
            ApiId: !Ref CommentsHttpApi
            Path: /posts/{slug}/mine
            Method: get
        CreateComment:
          Type: HttpApi
          Properties:
            ApiId: !Ref CommentsHttpApi
            Path: /posts/{slug}/comments
            Method: post
        EditComment:
          Type: HttpApi
          Properties:
            ApiId: !Ref CommentsHttpApi
            Path: /comments/{id}
            Method: patch
        DeleteComment:
          Type: HttpApi
          Properties:
            ApiId: !Ref CommentsHttpApi
            Path: /comments/{id}
            Method: delete
        AddReaction:
          Type: HttpApi
          Properties:
            ApiId: !Ref CommentsHttpApi
            Path: /posts/{slug}/reactions/{kind}
            Method: put
        RemoveReaction:
          Type: HttpApi
          Properties:
            ApiId: !Ref CommentsHttpApi
            Path: /posts/{slug}/reactions/{kind}
            Method: delete
        ReportComment:
          Type: HttpApi
          Properties:
            ApiId: !Ref CommentsHttpApi
            Path: /comments/{id}/report
            Method: post
        GetMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref CommentsHttpApi
            Path: /me
            Method: get
        PutMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref CommentsHttpApi
            Path: /me
            Method: put
        DeleteMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref CommentsHttpApi
            Path: /me
            Method: delete
        AdminHeld:
          Type: HttpApi
          Properties:
            ApiId: !Ref CommentsHttpApi
            Path: /admin/held
            Method: get
            Auth:
              Authorizer: OwnerJwt
        AdminComment:
          Type: HttpApi
          Properties:
            ApiId: !Ref CommentsHttpApi
            Path: /admin/comments/{id}
            Method: put
            Auth:
              Authorizer: OwnerJwt
        AdminUser:
          Type: HttpApi
          Properties:
            ApiId: !Ref CommentsHttpApi
            Path: /admin/users/{sub}
            Method: put
            Auth:
              Authorizer: OwnerJwt

  CommentsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-comments"
      RetentionInDays: 14

  CommentsHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingRateLimit: 20
        ThrottlingBurstLimit: 40
      Auth:
        DefaultAuthorizer: CommentersJwt
        Authorizers:
          CommentersJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CommentersUserPool}"
              audience:
                - !Ref CommentersUserPoolClient
          # Moderation signs in with the owner's existing account; the Lambda
          # also requires OWNER_SUB, since that pool has other users.
          OwnerJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${OwnerUserPoolId}"
              audience:
                - !Ref OwnerClientId
      CorsConfiguration:
        AllowOrigins:
          - "https://hopeandtruthministry.com"
          - "https://www.hopeandtruthministry.com"
          - "http://localhost:5173"
          - "http://localhost:4173"
        AllowHeaders:
          - Authorization
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        MaxAge: 300

Outputs:
  CommentsApiUrl:
    Description: "Comments API base URL — set as VITE_COMMENTS_API_URL"
    Value: !Sub "https://${CommentsHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  CommentersUserPoolId:
    Description: "Commenter pool id — set as VITE_AUTH_POOL_ID"
    Value: !Ref CommentersUserPool
  CommentersClientId:
    Description: "Commenter SPA client id — set as VITE_AUTH_CLIENT_ID"
    Value: !Ref CommentersUserPoolClient
  CommentersAuthDomain:
    Description: "Managed login domain — set as VITE_AUTH_DOMAIN"
    Value: !Sub "https://${CommentersUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
  BloggerApiUrl:
    Description: "API Gateway endpoint URL for Blogger proxy"
    Value: !Sub "https://${BloggerApiGateway}.execute-api.${AWS::Region}.amazonaws.com/prod/blogger/posts"
  BloggerProxyFunctionArn:
    Description: "Blogger Proxy Lambda Function ARN"
    Value: !GetAtt BloggerProxyFunction.Arn
  ContactApiUrl:
    Description: "Contact form API endpoint — set as VITE_CONTACT_API_URL in your build env"
    Value: !Sub "https://${ContactHttpApi}.execute-api.${AWS::Region}.amazonaws.com/contact"
  SesDomain:
    Description: "SES verified sending domain"
    Value: !Ref SenderDomain
