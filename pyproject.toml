[tool.ruff]
include = ["scripts/*.py"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes (unused imports, undefined names)
  "I",   # isort (import order)
  "UP",  # pyupgrade (modernize syntax)
  "B",   # flake8-bugbear (common bug patterns)
]
ignore = [
  "E501",  # line too long — HTML templates make this impractical
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["scripts"]

[tool.coverage.run]
source = ["scripts"]
omit = ["scripts/test_*.py"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "coverage/py"
